# Default-deny ingress for the namespace, then allow only the ingress
# controller (Traefik, in namespace "traefik") to reach the app port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wisecow-allow-ingress-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wisecow
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 4499
          protocol: TCP
