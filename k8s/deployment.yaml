apiVersion: apps/v1
kind: Deployment
metadata:
  name: wisecow
  labels:
    app.kubernetes.io/name: wisecow
spec:
  # wisecow.sh serves one connection at a time, so run more than one replica
  # to keep the app available during probes, restarts and rollouts.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: wisecow
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wisecow
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wisecow
          # CI/CD replaces this with the exact image digest it just built
          # (see hack/deploy.sh).
          image: ghcr.io/ashutosharma2/wisecow:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4499
              protocol: TCP
          # Readiness: should this pod get traffic right now? Reacts fast, so
          # a slow pod drops out of the Service within ~30 s.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness: is this pod stuck past recovery? Tolerates slowness
          # (10 s timeout, ~2 min of failures) so a starved but working pod
          # isn't restarted, which would only add load.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # wisecow.sh creates its "response" named pipe in the working dir.
            - name: run
              mountPath: /app/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 10Mi
