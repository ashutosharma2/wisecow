apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow
  labels:
    app.kubernetes.io/name: wisecow
  annotations:
    # Serve this route on the HTTPS entrypoint only. Plain HTTP on :80 is
    # redirected to HTTPS by the controller (see hack/traefik-values.yaml).
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wisecow.local
      secretName: wisecow-tls
  rules:
    - host: wisecow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow
                port:
                  name: http
