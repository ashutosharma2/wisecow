# Single-node kind cluster. Host ports 80/443 are forwarded to the Traefik
# NodePorts so https://wisecow.local works from the host.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        protocol: TCP
